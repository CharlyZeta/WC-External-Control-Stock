version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: stockdual-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stockdual}
      POSTGRES_USER: ${POSTGRES_USER:-stockdual}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - stockdual_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stockdual}" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  stockdual_pgdata:
    driver: local
